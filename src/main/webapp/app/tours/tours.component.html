<div class="tours-banner">
  <img src="/content/images/home_img.png" class="banner-img" alt="Banner" />

  <div class="slideshow-container">
    <img [src]="images[currentIndex]" class="slide" style="border-radius: 4px"/>
  </div>

  <div class="search-bar">
    <div class="search-item">
      <label>Điểm khởi hành</label>
      <select>
        <option>Tất cả</option>
        <option>Hà Nội</option>
        <option>Hồ Chí Minh</option>
      </select>
    </div>

    <div class="search-item">
      <label> Điểm đến</label>
      <select>
        <option>Tất cả</option>
        <option>Đà Nẵng</option>
        <option>Nha Trang</option>
      </select>
    </div>

    <div class="search-item">
      <label> Ngày khởi hành</label>
      <select>
        <option>Tất cả</option>
        <option>Tháng 8</option>
        <option>Tháng 9</option>
      </select>
    </div>

    <div class="search-item">
      <label> Ngân sách</label>
      <select>
        <option>Chọn mức giá</option>
        <option>Dưới 5 triệu</option>
        <option>5 - 10 triệu</option>
      </select>
    </div>

    <button class="search-btn">TÌM KIẾM</button>
  </div>
</div>

<div class="container" style="margin-top: 50px">
  <h1 style="text-align: center; font-size: 40px; color: #6BCDEC;font-weight: bold; margin-bottom: 36px">TOUR ĐƯỢC ĐẶT NHIỀU NHẤT</h1>

  <div *ngIf="visibleTours.length > 0" class="tour-container">
    <div class="tour-grid">
      <div *ngFor="let tour of visibleTours; let i = index" class="tour-card">
        <div>
          <div class="tour-img-wrapper">
            <img *ngIf="tour.imageUrl" [src]="tour.imageUrl" alt="{{ tour.tourName }}" class="tour-img"/>
            <div class="tour-img-container">
              <img src="/content/images/Rank_img.svg" class="rank-img" alt="Rank"/>
              <div class="rank-badge">{{ i + 1 + (currentPage * pageSize) }}</div>
            </div>
          </div>
          <div style="padding: 20px;">
            <div>
              <h3 style="color:black; font-size: 24px;font-weight: bold;">{{ tour.tourName }}</h3>
              <div style="font-size: 14px">
                <div style="margin-bottom: 16px"><b>Điểm đến:</b></div>
                <div style="margin-bottom: 16px"><b>Điểm khởi hành:</b> {{ tour.location }}</div>
                <div style="margin-bottom: 16px"><b>Ngày khởi hành:</b> {{ tour.startDate }}</div>
                <div style="margin-bottom: 16px"><b>Rating:</b> {{ tour.averageRating }} ⭐ ({{ tour.reviewCount }} reviews)</div>
              </div>
            </div>
            <div class="price-row">
              <div><b>Giá từ:</b>
                <div style="color: #D32D2D; font-size: 20px; font-weight: bold;">{{ tour.price }} VNĐ</div>
              </div>
              <div>
                <button class="btn-book" [routerLink]="[tour.id]">Đặt ngay</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button (click)="prevPage()" [disabled]="currentPage === 0">Previous</button>
      <button (click)="nextPage()" [disabled]="(currentPage+1) * pageSize >= tours.length">Next</button>
    </div>
  </div>

</div>
