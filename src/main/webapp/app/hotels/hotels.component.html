<div class="hotels-banner">
  <img src="/content/images/toursImg/backgroundImg.svg" class="banner-img" alt="Banner"/>

  <div class="banner-content">
    <form [formGroup]="searchForm" (ngSubmit)="onSubmit()">
      <div class="search-bar">
        <div class="search-item">
          <label>Chọn thành phố</label>
          <input
            style="font-size: 16px; border-radius: 8px;margin-right: 20px;border: 2px solid #0a0a0a;"
            type="text"
            formControlName="city"
            (input)="onInputChangeDestinetion($event)"
          />
          <ul class="suggestions" *ngIf="destinationSuggestions.length > 0">
            <li
              *ngFor="let s of destinationSuggestions"
              (click)="selectDestination(s)"
              class="suggestion-item"
            >
              {{ s.name }}
            </li>
          </ul>
        </div>

        <div class="search-item">
          <label> Đánh giá</label>
          <select
            formControlName="rating"
            style="font-size: 16px; border-radius: 8px; margin-right: 20px; border: 2px solid #0a0a0a; padding: 1px 2px; background-color: white; cursor: pointer;"
          >
            <option value="5">5 sao</option>
            <option value="4">4 sao</option>
            <option value="3">3 sao</option>
            <option value="2">2 sao</option>
            <option value="1">1 sao</option>
          </select>
        </div>

        <button type="submit" class="search-btn">TÌM KIẾM</button>
      </div>
    </form>
  </div>
</div>
