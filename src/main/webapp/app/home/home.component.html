<div class="home-banner">
  <img src="/content/images/pexels-robinerino-3084564.jpg" class="banner-img" alt="Banner" />

  <div class="search-box">
    <input
      type="text"
      class="form-control"
      placeholder="Tìm tour, địa điểm, hoặc từ khóa..."
      [(ngModel)]="keyword"
      (keyup.enter)="search()"
    />
    <button class="btn btn-search" (click)="search()">
      <i class="fa-solid fa-magnifying-glass"></i>
    </button>
  </div>
</div>

<div class="home-content container">
  <h1 class="display-4">Chào mừng bạn đến với Java Hipster!</h1>
  <p class="lead">Đây là trang chủ của bạn</p>
</div>
