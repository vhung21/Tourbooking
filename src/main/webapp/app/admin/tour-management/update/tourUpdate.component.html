<div class="edit-tour-container">
  <h2>Cập nhật tour</h2>

  <form *ngIf="tourData" (ngSubmit)="updateTour()" #tourForm="ngForm">

    <!-- Thông tin cơ bản -->
    <div class="form-section">
      <h3>Thông tin cơ bản</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Tên tour</label>
          <input type="text" [(ngModel)]="tourData.tourName" name="tourName" required />
        </div>

        <div class="form-group">
          <label>Giá (VNĐ)</label>
          <input type="number" [(ngModel)]="tourData.price" name="price" required />
        </div>

        <div class="form-group">
          <label>Khởi hành</label>
          <input type="text" [(ngModel)]="tourData.departures" name="departures" />
        </div>

        <div class="form-group">
          <label>Điểm đến</label>
          <input type="text" [(ngModel)]="tourData.destination" name="destination" />
        </div>

        <div class="form-group">
          <label>Phương tiện</label>
          <input type="text" [(ngModel)]="tourData.transportation" name="transportation" />
        </div>

        <div class="form-group">
          <label>Ngày bắt đầu</label>
          <input type="date" [(ngModel)]="tourData.startDate" name="startDate" />
        </div>

        <div class="form-group">
          <label>Ngày kết thúc</label>
          <input type="date" [(ngModel)]="tourData.endDate" name="endDate" />
        </div>

        <div class="form-group full-width">
          <label>Ảnh đại diện</label>
          <input type="text" [(ngModel)]="tourData.imageUrl" name="imageUrl" placeholder="URL ảnh..." />
          <img *ngIf="tourData.imageUrl" [src]="tourData.imageUrl" class="preview-img" />
        </div>
      </div>
    </div>

<!--     Chi tiết tour-->
    <div *ngIf="tourData.detail" class="form-section">
      <h3>Chi tiết tour</h3>
      <label> Mô tả</label>
      <textarea rows="3" [(ngModel)]="tourData.description" name="description" placeholder="Mô tả ngắn..."></textarea>
      <label> Tổng quan </label>
      <textarea rows="3" [(ngModel)]="tourData.detail.overview" name="overview" placeholder="Tổng quan"></textarea>
      <label> Chính sách trẻ em</label>
      <textarea rows="3" [(ngModel)]="tourData.detail.childrenPolicy" name="childrenPolicy" placeholder="Chính sách trẻ em"></textarea>
      <label> Hướng dẫn dặt tour</label>
      <textarea rows="3" [(ngModel)]="tourData.detail.bookingGuide" name="bookingGuide" placeholder="Hướng dẫn đặt tour"></textarea>
      <label> Chính sách hủy tour</label>
      <textarea rows="3" [(ngModel)]="tourData.detail.cancellationPolicy" name="cancellationPolicy" placeholder="Chính sách hủy tour"></textarea>
      <label> Điều khoản và ghi chú</label>
      <textarea rows="3" [(ngModel)]="tourData.detail.termsNotes" name="termsNotes" placeholder="Điều khoản và ghi chú"></textarea>
      <label> Thông tin thêm</label>
      <textarea rows="3" [(ngModel)]="tourData.detail.additionalInfo" name="additionalInfo" placeholder="Thông tin thêm"></textarea>
    </div>

    <!-- Lịch trình -->
    <div class="form-section">
      <div class="section-header">
        <h3>Lịch trình</h3>
        <button type="button" class="add-itinerary-btn" (click)="addItinerary()">
          Thêm lịch trình <i class="fas fa-plus"></i>
        </button>
      </div>

      <div *ngFor="let item of tourData.itineraries; let i = index" class="itinerary">
        <div class="itinerary-header">
        <label>Ngày {{ i + 1 }}</label>
          <button type="button" class="delete-btn" (click)="removeItinerary(i)">
            <i class="fas fa-trash-alt" style="color: red;background: white"></i>
          </button>
        </div>

        <input
          type="text"
          [(ngModel)]="item.toursItineraryTitle"
          [name]="'title' + i"
          placeholder="Tiêu đề"
        />
        <textarea
          rows="2"
          [(ngModel)]="item.toursItineraryDescription"
          [name]="'desc' + i"
          placeholder="Mô tả"
        ></textarea>
      </div>
    </div>

    <!-- Bao gồm -->
    <div class="form-section">
      <div class="section-header">
        <h3>Dịch vụ bao gồm / không bao gồm</h3>
      </div>

      <div class="inclusion-container">
        <!-- Cột 1: Bao gồm -->
        <div class="inclusion-column">
          <div class="column-header">
            <h4>Bao gồm</h4>
            <button type="button" class="add-btn" (click)="addInclusion(1)">
              <fa-icon icon="plus"></fa-icon>
            </button>
          </div>

          <div
            class="inclusion-item"
            *ngFor="let item of includedInclusions; let i = index"
          >
            <input
              type="text"
              [(ngModel)]="item.toursInclusionName"
              [name]="'included' + i"
              placeholder="Nhập dịch vụ bao gồm..."
            />
            <button type="button" class="delete-btn" (click)="removeInclusion(item)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>

        <!-- Cột 2: Không bao gồm -->
        <div class="inclusion-column">
          <div class="column-header">
            <h4>Không bao gồm</h4>
            <button type="button" class="add-btn" (click)="addInclusion(0)">
              <fa-icon icon="plus"></fa-icon>
            </button>
          </div>

          <div
            class="inclusion-item"
            *ngFor="let item of excludedInclusions; let j = index"
          >
            <input
              type="text"
              [(ngModel)]="item.toursInclusionName"
              [name]="'excluded' + j"
              placeholder="Nhập dịch vụ không bao gồm..."
            />
            <button type="button" class="delete-btn" (click)="removeInclusion(item)">
              <i class="fas fa-trash-alt"></i>
            </button>
          </div>
        </div>
      </div>
    </div>

    <button class="submit-btn" type="submit">Cập nhật tour</button>
  </form>
</div>
