<div class="edit-tour-container">
  <h2>Cập nhật khách sạn</h2>

  <form *ngIf="hotelData" (ngSubmit)="updateTour()" #tourForm="ngForm">

    <!-- Thông tin cơ bản -->
    <div class="form-section">
      <h3>Thông tin cơ bản</h3>
      <div class="form-grid">
        <div class="form-group">
          <label>Tên khách sạn</label>
          <input type="text" [(ngModel)]="hotelData.name" name="name" required/>
        </div>

        <div class="form-group">
          <label>Thành phố</label>
          <input type="text" [(ngModel)]="hotelData.city" name="city"/>
        </div>

        <div class="form-group">
          <label>Đánh giá</label>
          <input type="text" [(ngModel)]="hotelData.rating" name="rating"/>
        </div>

        <div class="form-group">
          <label>Số điện thoại</label>
          <input type="number" [(ngModel)]="hotelData.phone" name="phone" required/>
        </div>

        <div class="form-group full-width">
          <label>Địa chỉ</label>
          <input type="text" [(ngModel)]="hotelData.address" name="address"/>
        </div>

        <div class="form-group full-width">
          <label>Mô tả</label>
          <textarea rowx="3" type="text" [(ngModel)]="hotelData.description" name="description"></textarea>
        </div>

        <div class="form-group full-width">
          <label>Ảnh khách sạn</label>
          <input type="text" [(ngModel)]="hotelData.imageUrl" name="imageUrl" placeholder="URL ảnh..."/>
          <img *ngIf="hotelData.imageUrl" [src]="hotelData.imageUrl" class="preview-img"/>
        </div>
      </div>
    </div>

    <!--     Lịch trình-->
    <div class="form-section">
      <div class="section-header">
        <h3>Loại phòng</h3>
        <button type="button" class="add-itinerary-btn" (click)="addRoom()">
          Thêm loại phòng <i class="fas fa-plus"></i>
        </button>
      </div>

      <div *ngFor="let item of hotelData.rooms; let i = index" class="itinerary">
        <div class="itinerary-header">
          <label>Loại phòng {{ i + 1 }}</label>
          <button type="button" class="delete-btn" (click)="removeRoom(i)">
            <i class="fas fa-trash-alt" style="color: red;background: white"></i>
          </button>
        </div>

        <label>Tên phòng</label>
        <input
          type="text"
          [(ngModel)]="item.roomType"
          [name]="'roomType' + i"
          placeholder="Loại phòng"
        />

        <label>Giá</label>
        <input
          type="number"
          [(ngModel)]="item.price"
          [name]="'price' + i"
          placeholder="Giá"
        />

        <label>Mô tả</label>
        <textarea
          rows="2"
          [(ngModel)]="item.description"
          [name]="'description' + i"
          placeholder="Mô tả"
        ></textarea>

        <label>Ảnh phòng</label>
        <input type="text" [(ngModel)]="item.imageUrl" name="imageUrl" placeholder="URL ảnh..."/>
        <img *ngIf="item.imageUrl" [src]="item.imageUrl" class="preview-img"/>

      </div>
    </div>
    <button class="submit-btn" type="submit">Cập nhật khách sạn</button>
  </form>
</div>
